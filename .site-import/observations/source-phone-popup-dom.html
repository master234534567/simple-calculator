<script id="fullscreen-script">
  function toggleFullScreen(elementId) {
    const el = elementId ? document.getElementById(elementId) : document.documentElement;
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) {
        el.requestFullscreen();
      } else if (el.webkitRequestFullscreen) { /* Safari */
        el.webkitRequestFullscreen();
      } else if (el.msRequestFullscreen) { /* IE11 */
        el.msRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }
</script>


<script id="autosave-script">
  // Save last played game or scroll position automatically
  window.addEventListener("beforeunload", () => {
    try {
      const activeGame = document.querySelector("iframe") ? document.querySelector("iframe").src : "";
      const state = {
        lastGame: activeGame,
        scrollPos: window.scrollY,
        timestamp: Date.now()
      };
      localStorage.setItem("gameLibraryState", JSON.stringify(state));
    } catch (e) {
      console.error("Auto-save failed:", e);
    }
  });

  // Restore state on load
  window.addEventListener("DOMContentLoaded", () => {
    try {
      const saved = localStorage.getItem("gameLibraryState");
      if (saved) {
        const state = JSON.parse(saved);
        if (state.scrollPos) {
          window.scrollTo(0, state.scrollPos);
        }
        // If you want to auto-load the last game, you can hook into this data here!
        console.log("Restored previous session from:", new Date(state.timestamp).toLocaleTimeString());
      }
    } catch (e) {
      console.error("Failed to load saved state:", e);
    }
  });
</script>


<script id="safeloader-script">
  function loadGameSafely(gameUrl) {
    const container = document.getElementById("game-container") || document.body;
    
    // Remove existing game frame if any
    const oldFrame = document.getElementById("active-game-frame");
    if (oldFrame) oldFrame.remove();

    const iframe = document.createElement("iframe");
    iframe.id = "active-game-frame";
    iframe.src = gameUrl;
    iframe.width = "100%";
    iframe.height = "100%";
    // Sandbox restriction to protect the main library site from crashes
    iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-pointer-lock allow-forms");
    iframe.style.border = "none";
    
    iframe.onerror = () => {
      alert("Failed to load or execute this game. It might require specific server assets (like .wasm files).");
    };

    container.appendChild(iframe);
  }
</script>

    function normalizeGameName(name) {
      return String(name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function normalizePopularKey(value) {
      const normalized = normalizeGameName(value)
        .replace(/^celete$/i, "celeste")
        .replace(/^badtimesimulator$/i, "badtimesimulatorsansfight")
        .replace(/^fnaf1$/i, "fnaf");
      return normalized;
    }

    function isPopularGame(title, filename = "") {
      const values = [title, filename];
      return values.some((value) => popularGameKeys.has(normalizePopularKey(value)));
    }

    function isNewGame(title, filename = "") {
      return [title, filename].some((value) => newGameKeys.has(normalizeGameName(value)));
    }

    function getGameCategoryRank(title, filename, category) {
      const ranks = gameCategoryRanks[category];
      if (!ranks) return -1;
      const basename = filename.split("/").pop().replace(/\.(html?|htm)$/i, "").replace(/\/index$/i, "");
      for (const value of [title, basename]) {
        const rank = ranks.get(normalizeGameName(value));
        if (rank !== undefined) return rank;
      }
      return -1;
    }

    function getTitle(filename) {
      if (!filename) return "";
      if (gameTitleOverrides.has(filename)) return gameTitleOverrides.get(filename);
      let base = filename.toString();
      base = base.replace(/\.(html|htm)$/i, "");
      if (/\/index$/i.test(base) || /^index$/i.test(base)) {
        base = base.replace(/\/index$/i, "");
      }
      let parts = base.split("/").filter(Boolean);
      if (parts.length > 0) {
        const boilerplate = ["offline html games pack master", "gamelist", "offline", "originals", "patch", "dist", "build"];
        let selected = parts[parts.length - 1];
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i].toLowerCase().trim();
          if (!boilerplate.includes(p)) {
            selected = parts[i];
            break;
          }
        }
        base = selected;
      }
      base = base.replace(/offline\s*pack/gi, "")
                 .replace(/offline html games pack master/gi, "")
                 .replace(/gamelist/gi, "")
                 .replace(/offline/gi, "")
                 .replace(/[-_]+/g, " ")
                 .trim();
      if (!base) base = filename;
      return base.replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    async function openGame(url, title) {
      currentGameTitle.textContent = title;
      gameFrame.hidden = true;
      gameError.hidden = true;
      gameContainer.style.display = "flex";

      const nestedGame = url.match(/^gamelist\/([^/]+)\//i);
      if (nestedGame) {
        const parentGame = `gamelist/${nestedGame[1]}/index.html`;
        if (url !== parentGame && gamePaths.has(parentGame)) {
          url = parentGame;
        }
      }

      if (!/^https?:\/\//i.test(url)) {
        try {
          const response = await fetch(url, { method: "HEAD" });
          if (response.status === 404) {
            gameError.textContent = `${title} could not be found.`;
            gameError.hidden = false;
            return;
          }

          if (
            url.startsWith("Offline-HTML-Games-Pack-master/offline/") &&
            response.ok &&
            response.headers.get("content-length") === "0"
          ) {
            const filename = url.split("/").pop().replace(/\.(html?|htm)$/i, "");
            const key = normalizeGameName(filename);
            const fallback = gameFallbacks.get(key) || gameFallbackAliases.get(key);
            if (fallback && fallback !== url) {
              url = fallback;
              currentGameTitle.textContent = getTitle(fallback);
            } else {
              gameError.textContent = `${title} is an empty offline-pack placeholder, and no matching playable page was found in the game library.`;
              gameError.hidden = false;
              return;
            }
          }
        } catch (error) {
          console.warn(`Could not check ${url} before loading:`, error);
        }
      }

      gameFrame.src = url;
      gameFrame.hidden = false;
    }

    function reloadGame() {
      if (gameFrame.src) {
        gameFrame.contentWindow.location.reload();
      }
    }

    function closeGame() {
      gameContainer.style.display = "none";
      gameFrame.src = "";
      gameError.hidden = true;
    }

    async function loadGames() {
      try {
        const [response, imageResponse] = await Promise.all([
          fetch("games-manifest.json", { cache: "no-store" }),
          fetch("game-art-manifest.json", { cache: "no-store" })
        ]);
        if (!response.ok) throw new Error("Unable to load game manifest.");
        const filenames = await response.json();
        gameImageManifest = imageResponse.ok ? await imageResponse.json() : {};
        gamePaths = new Set(filenames);
        gameFallbacks = new Map();
        filenames.forEach((filename) => {
          const match = filename.match(/^gamelist\/([^/]+)\/index\.html$/i);
          if (match) {
            const key = normalizeGameName(match[1]);
            if (!gameFallbacks.has(key)) gameFallbacks.set(key, filename);
          }
        });

        list.innerHTML = "";
        const fragment = document.createDocumentFragment();

        filenames.forEach((filename, originalIndex) => {
          const title = getTitle(filename);
          const item = document.createElement("li");
          item.className = "item";
          item.dataset.originalIndex = String(originalIndex);
          item.dataset.name = `${title} ${filename}`.toLowerCase();
          item.dataset.popular = String(isPopularGame(title, filename));
          item.dataset.new = String(isNewGame(title, filename));
          for (const category of Object.keys(gameCategoryGroups)) {
            const rank = getGameCategoryRank(title, filename, category);
            item.dataset[category] = String(rank >= 0);
            item.dataset[`${category}Rank`] = String(rank);
          }
          item.dataset.title = title;
          item.dataset.filename = filename;

          const button = document.createElement("button");
          button.className = "game-card";
          button.type = "button";
          button.setAttribute("aria-label", `Play ${title}`);
          button.onclick = () => openGame(filename, title);

          const art = document.createElement("span");
          art.className = "game-art";
          art.setAttribute("aria-hidden", "true");

          const fallback = document.createElement("span");
          fallback.className = "game-art-fallback";
          fallback.textContent = title;
          art.append(fallback);

          const badgeText = isNewGame(title, filename) ? "NEW" : isPopularGame(title, filename) ? "HOT" : "";
          if (badgeText) {
            const badge = document.createElement("span");
            badge.className = `game-badge ${badgeText.toLowerCase()}`;
            badge.textContent = badgeText;
            badge.setAttribute("aria-hidden", "true");
            art.append(badge);
          }

          const imageCandidates = getImageCandidates(filename);
          if (imageCandidates.length > 0) {
            const image = document.createElement("img");
            image.alt = "";
            const mappedOfflineImage = filename.startsWith("Offline-HTML-Games-Pack-master/offline/")
              && Boolean(gameImageManifest[filename]);
            image.loading = mappedOfflineImage ? "eager" : "lazy";
            image.decoding = "async";
            image.onload = () => {
              fallback.hidden = true;
            };
            let candidateIndex = 0;
            image.onerror = () => {
              candidateIndex += 1;
              if (candidateIndex < imageCandidates.length) {
                image.src = imageCandidates[candidateIndex];
              } else {
                image.remove();
              }
            };
            image.src = imageCandidates[candidateIndex];
            art.prepend(image);
          }

          const titleElement = document.createElement("span");
          titleElement.className = "item-title";
          titleElement.textContent = title;
          button.append(art, titleElement);
          item.append(button);
          fragment.append(item);
        });

        list.append(fragment);
        status.textContent = filenames.length === 0 ? "No games found." : "";
        document.getElementById("game-count").textContent = `Total Games: ${filenames.length}`;
        filterItems();
      } catch (error) {
        status.textContent = error.message;
      }
    }

    function getImageCandidates(filename) {
      if (Object.prototype.hasOwnProperty.call(gameImageManifest, filename)) {
        const image = gameImageManifest[filename];
        return image ? [image] : [];
      }

      if (filename.startsWith("Offline-HTML-Games-Pack-master/offline/")) {
        const image = gameImageManifest[filename];
        return image ? [image] : [];
      }

      if (/^https?:\/\//i.test(filename)) return [];

      const pathParts = filename.split("/");
      const gameDirectory = pathParts[0] === "gamelist" && pathParts.length > 2
        ? `gamelist/${pathParts[1]}`
        : pathParts.slice(0, -1).join("/");
      const gameName = pathParts[0] === "gamelist" && pathParts.length > 2
        ? pathParts[1]
        : (pathParts[pathParts.length - 1] || "").replace(/\.(html?|htm)$/i, "");
      if (!gameDirectory || !gameName) return [];

      const names = [...new Set([
        gameName,
        gameName.toLowerCase(),
        gameName.replace(/[^a-z0-9]/gi, ""),
        gameName.replace(/[^a-z0-9]/gi, "").toLowerCase()
      ])];
      const extensions = ["png", "jpg", "jpeg", "webp", "gif"];
      const candidates = names.flatMap((name) =>
        extensions.map((extension) => `${gameDirectory}/${name}.${extension}`)
      );
      const override = gameImageOverrides.get(gameDirectory);
      return override ? [override, ...candidates] : candidates;
    }

    function setGameFilter(filter) {
      activeGameFilter = filter;
      search.value = "";
      const buttons = {
        all: allGamesButton,
        popular: popularButton,
        new: newGamesButton,
        racing: racingButton,
        shooting: shootingButton,
        fnaf: fnafButton
      };
      for (const [name, button] of Object.entries(buttons)) {
        const isActive = name === filter;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      }
      filterItems();
    }

    function filterItems() {
      const query = search.value.toLowerCase();
      const items = Array.from(list.getElementsByClassName("item"));
      const categoryRanks = gameCategoryRanks[activeGameFilter];
      const categoryTitleWinners = new Map();

      if (categoryRanks) {
        for (const item of items) {
          if (item.dataset[activeGameFilter] !== "true") continue;
          const titleKey = normalizeGameName(item.dataset.title);
          const currentWinner = categoryTitleWinners.get(titleKey);
          const isLibraryPage = /^gamelist\/[^/]+\/index\.html$/i.test(item.dataset.filename);
          const winnerIsLibraryPage = currentWinner && /^gamelist\/[^/]+\/index\.html$/i.test(currentWinner.dataset.filename);
          if (!currentWinner || (isLibraryPage && !winnerIsLibraryPage)) {
            categoryTitleWinners.set(titleKey, item);
          }
        }
      }

      for (const item of items) {
        const name = item.dataset.name;
        const matchesQuery = !query || name.includes(query);
        const matchesCategory = activeGameFilter === "all" || (
          item.dataset[activeGameFilter] === "true" &&
          (!categoryRanks || categoryTitleWinners.get(normalizeGameName(item.dataset.title)) === item)
        );
        item.style.display = matchesQuery && matchesCategory ? "" : "none";
      }

      items.sort((left, right) => {
        if (!categoryRanks) return Number(left.dataset.originalIndex) - Number(right.dataset.originalIndex);
        const rankKey = `${activeGameFilter}Rank`;
        const leftMatches = categoryTitleWinners.get(normalizeGameName(left.dataset.title)) === left;
        const rightMatches = categoryTitleWinners.get(normalizeGameName(right.dataset.title)) === right;
        if (leftMatches !== rightMatches) return leftMatches ? -1 : 1;
        const rankDiff = Number(left.dataset[rankKey]) - Number(right.dataset[rankKey]);
        return rankDiff || Number(left.dataset.originalIndex) - Number(right.dataset.originalIndex);
      });
      const fragment = document.createDocumentFragment();
      items.forEach((item) => fragment.append(item));
      list.append(fragment);
    }

    allGamesButton.addEventListener("click", () => setGameFilter("all"));
    popularButton.addEventListener("click", () => setGameFilter("popular"));
    newGamesButton.addEventListener("click", () => setGameFilter("new"));
    racingButton.addEventListener("click", () => setGameFilter("racing"));
    shootingButton.addEventListener("click", () => setGameFilter("shooting"));
    fnafButton.addEventListener("click", () => setGameFilter("fnaf"));

    loadGames();
  </script>
